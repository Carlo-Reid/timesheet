<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Timesheet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:#1D9E75; --green-d:#0F6E56; --green-l:#E1F5EE;
    --amber:#BA7517; --amber-l:#FAEEDA;
    --red:#A32D2D; --red-l:#FCEBEB;
    --g50:#F7F7F5; --g100:#EBEBEA; --g300:#C4C4C2;
    --g500:#808080; --g700:#444441; --g900:#1A1A18;
    --r:8px; --rl:12px;
    --mono:'Courier New',monospace; --sans:system-ui,-apple-system,sans-serif;
  }
  body { font-family:var(--sans); background:var(--g50); color:var(--g900); min-height:100vh; padding:1.5rem 1rem; }
  .wrap { max-width:820px; margin:0 auto; }

  /* Header */
  .app-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:.75rem; }
  .app-title { font-size:20px; font-weight:600; } .app-title span { color:var(--green); }

  /* Banner */
  .tech-banner { background:var(--green); color:#fff; padding:.5rem 1rem; border-radius:var(--r); font-size:15px; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.6rem; }
  .tech-banner .tb-period { font-size:11px; font-weight:400; opacity:.85; margin-left:auto; }

  /* Cards */
  .card { background:#fff; border:1px solid var(--g100); border-radius:var(--rl); padding:1.25rem; margin-bottom:1rem; }
  .card-title { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--g500); margin-bottom:.85rem; }

  /* Setup */
  .setup-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.75rem; align-items:end; }
  @media(max-width:520px){ .setup-grid { grid-template-columns:1fr; } }
  .field label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--g500); margin-bottom:.3rem; }
  .field input, .field select { width:100%; padding:.5rem .7rem; border:1px solid var(--g300); border-radius:var(--r); font-size:14px; font-family:var(--sans); background:#fff; color:var(--g900); }
  .field input:focus, .field select:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(29,158,117,.12); }
  .manage-link { font-size:12px; color:var(--green-d); background:none; border:none; cursor:pointer; font-family:var(--sans); padding:0; text-decoration:underline; }

  /* Buttons */
  .btn { padding:.5rem 1.1rem; border-radius:var(--r); font-size:13px; font-weight:600; font-family:var(--sans); cursor:pointer; border:none; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-g { background:var(--green); color:#fff; } .btn-g:hover:not(:disabled) { background:var(--green-d); }
  .btn-o { background:transparent; border:1px solid var(--g300); color:var(--g700); } .btn-o:hover:not(:disabled) { background:var(--g50); }

  /* On Call */
  .on-call-row { display:flex; align-items:center; gap:.75rem; padding:.5rem .75rem; background:var(--amber-l); border:1px solid #F5C842; border-radius:var(--r); margin-bottom:1rem; }
  .on-call-row label { font-size:12px; font-weight:700; color:#633806; white-space:nowrap; }
  .on-call-row input[type=number] { width:80px; padding:.35rem .5rem; border:1px solid #F5C842; border-radius:var(--r); font-size:14px; font-family:var(--mono); text-align:center; }
  .on-call-row input:focus { outline:none; border-color:var(--amber); }

  /* Week label */
  .week-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--g500); margin:.75rem 0 .4rem; }

  /* Day rows */
  .day-table { width:100%; border-collapse:collapse; margin-bottom:.5rem; }
  .day-table th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--g500); padding:.35rem .5rem; border-bottom:2px solid var(--g100); text-align:left; }
  .day-table th.center { text-align:center; }
  .day-table td { padding:.3rem .4rem; border-bottom:1px solid var(--g100); vertical-align:middle; }
  .day-table tr:last-child td { border-bottom:none; }
  .day-table tr.weekend td { background:var(--g50); }
  .day-table tr.today td { background:#E8F5E9; }
  .day-table tr.future td { opacity:.4; pointer-events:none; }

  .day-name { font-size:13px; font-weight:600; color:var(--g700); width:90px; }
  .day-date { font-size:12px; color:var(--g500); width:90px; font-family:var(--mono); }

  /* Time button */
  .time-btn { display:flex; align-items:center; gap:4px; padding:.32rem .55rem; border:1px solid var(--g100); border-radius:var(--r); font-size:12px; font-family:var(--mono); color:var(--g900); background:var(--g50); cursor:pointer; width:100%; white-space:nowrap; }
  .time-btn:hover { border-color:var(--green); background:#fff; }
  .time-btn .tb-icon { font-size:11px; color:var(--g500); }
  td.time-col { width:110px; }

  /* Note */
  td.note-col { min-width:130px; }
  .note-input { width:100%; padding:.32rem .45rem; border:1px solid var(--g100); border-radius:var(--r); font-size:12px; font-family:var(--sans); color:var(--g900); background:var(--g50); }
  .note-input:focus { outline:none; border-color:var(--green); background:#fff; }

  /* Hours */
  td.hrs-col { width:75px; text-align:center; }
  .hrs-cell { font-size:13px; font-family:var(--mono); font-weight:700; color:var(--green-d); background:var(--green-l); border-radius:var(--r); padding:.25rem .4rem; text-align:center; display:inline-block; width:100%; }
  td.acc-col { width:80px; text-align:center; font-size:12px; font-family:var(--mono); color:var(--g500); }

  /* Summary */
  .summary-bar { display:flex; gap:1rem; flex-wrap:wrap; }
  .si { flex:1; min-width:130px; }
  .si .sl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--g500); }
  .si .sv { font-size:22px; font-weight:700; font-family:var(--mono); color:var(--g900); }

  /* Footer */
  .sheet-footer { display:flex; align-items:center; justify-content:space-between; padding-top:.75rem; border-top:1px solid var(--g100); flex-wrap:wrap; gap:.5rem; }

  /* Cloud status */
  .csync { font-size:12px; padding:.2rem .6rem; border-radius:99px; display:inline-flex; align-items:center; gap:4px; }
  .csync-ok  { background:var(--green-l); color:var(--green-d); }
  .csync-saving { background:var(--amber-l); color:#633806; }
  .csync-err { background:var(--red-l); color:var(--red); }

  /* Clock picker */
  .clock-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:400; align-items:center; justify-content:center; }
  .clock-overlay.open { display:flex; }
  .clock-box { background:#fff; border-radius:var(--rl); padding:1.5rem; width:300px; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.2); }
  .clock-box h3 { margin:0 0 .5rem; color:var(--g900); font-size:15px; font-weight:600; }
  .clock-live { font-size:28px; font-weight:700; color:#003366; margin:.75rem 0; font-family:var(--mono); letter-spacing:.05em; }
  .clock-box input[type="time"] { width:100%; padding:.75rem; font-size:18px; border:1px solid var(--g300); border-radius:var(--r); font-family:var(--mono); text-align:center; color:var(--g900); }
  .clock-box input[type="time"]:focus { outline:none; border-color:var(--green); }
  .clock-confirm { margin-top:.85rem; width:100%; padding:.75rem; background:#003366; color:#fff; border:none; border-radius:var(--r); font-size:15px; font-weight:600; cursor:pointer; font-family:var(--sans); }
  .clock-confirm:hover { background:#0055a5; }
  .clock-cancel { margin-top:.5rem; width:100%; padding:.5rem; background:transparent; color:var(--g500); border:1px solid var(--g300); border-radius:var(--r); font-size:13px; cursor:pointer; font-family:var(--sans); }

  /* Manage panel */
  .no-techs { font-size:13px; color:var(--g500); padding:.5rem 0; font-style:italic; }
  .opt-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; align-items:center; justify-content:center; }
  .opt-overlay.open { display:flex; }
  .opt-modal { background:#fff; border-radius:var(--rl); padding:1.5rem; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; margin:1rem; }
  .opt-modal h2 { font-size:16px; font-weight:600; margin-bottom:1.25rem; color:var(--g900); }
  .opt-section { margin-bottom:1.25rem; }
  .opt-section h3 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--g500); margin-bottom:.6rem; }
  .opt-list { display:flex; flex-direction:column; gap:4px; margin-bottom:.6rem; }
  .opt-item { display:flex; align-items:center; justify-content:space-between; padding:.35rem .6rem; background:var(--g50); border-radius:var(--r); font-size:13px; }
  .rm-btn { border:none; background:transparent; cursor:pointer; color:var(--g300); font-size:16px; line-height:1; padding:0 2px; border-radius:3px; }
  .rm-btn:hover { color:var(--red); background:var(--red-l); }
  .opt-add-row { display:flex; gap:6px; }
  .opt-add-row input { flex:1; padding:.4rem .6rem; border:1px solid var(--g300); border-radius:var(--r); font-size:13px; font-family:var(--sans); color:var(--g900); }
  .opt-add-row input:focus { outline:none; border-color:var(--green); }
  .opt-add-row button { padding:.4rem .85rem; background:var(--green); color:#fff; border:none; border-radius:var(--r); font-size:13px; font-weight:600; cursor:pointer; }
  .opt-footer { display:flex; justify-content:flex-end; padding-top:.75rem; border-top:1px solid var(--g100); margin-top:.5rem; }
  .dl-tech-btn { padding:.25rem .65rem; background:var(--green-l); color:var(--green-d); border:1px solid #9FE1CB; border-radius:var(--r); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--sans); white-space:nowrap; }

  /* Flatpickr */
  .flatpickr-day.pay-start { background:#FFF176!important; color:#7A5700!important; font-weight:700!important; border-color:#F5C800!important; }
  .flatpickr-day.pay-start:hover { background:#F5C800!important; }
  .flatpickr-day.pay-current { background:#1D9E75!important; color:#fff!important; font-weight:700!important; border-color:#0F6E56!important; }
  .flatpickr-day.pay-current.selected, .flatpickr-day.pay-start.selected { background:#0F6E56!important; border-color:#0F6E56!important; }
  #period-start { cursor:pointer; background:#fff; }

  /* Toast */
  #toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); padding:.65rem 1.25rem; border-radius:var(--r); font-size:13px; font-weight:500; white-space:nowrap; transition:transform .25s ease; pointer-events:none; z-index:999; }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast.success { background:var(--green); color:#fff; }
  #toast.error   { background:var(--red);   color:#fff; }
  #toast.info    { background:var(--amber);  color:#fff; }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp .6s linear infinite; vertical-align:middle; margin-right:5px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  @media(max-width:600px){
    .day-table th.hide-sm, .day-table td.hide-sm { display:none; }
    .app-header { margin-bottom:1rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div class="app-title">Office <span>Timesheet</span></div>
    <div id="cloud-status"></div>
  </div>

  <!-- Setup -->
  <div class="card" id="setup-card">
    <div class="card-title">Pay Period Setup</div>
    <div class="setup-grid">
      <div class="field">
        <label>Employee Name</label>
        <select id="tech-name" style="width:100%;padding:.5rem .7rem;border:1px solid var(--g300);border-radius:var(--r);font-size:14px;font-family:var(--sans);background:#fff;color:var(--g900)">
          <option value="">— Select employee —</option>
        </select>
        <div style="margin-top:5px"><button class="manage-link" onclick="A.openTechs()">⚙ Manage employees</button></div>
      </div>
      <div class="field"><label>Pay Period Start</label><input type="date" id="period-start"></div>
      <div><button class="btn btn-g" onclick="A.load()" style="width:100%;padding:.55rem">Load Timesheet</button></div>
    </div>
  </div>

  <!-- Sheet area -->
  <div id="sheet-area" style="display:none">

    <div class="tech-banner" id="tech-banner">
      <span>🏢</span>
      <span id="tech-banner-name"></span>
      <span class="tb-period" id="tech-banner-period"></span>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem">
        <div class="card-title" id="period-title" style="margin-bottom:0"></div>
        <div id="cloud-status2"></div>
      </div>

      <!-- On Call -->
      <div class="on-call-row">
        <label>On Call Weeks:</label>
        <input type="number" id="on-call" min="0" max="52" step="1" placeholder="0"
          oninput="A.saveOnCall(this.value)">
        <span style="font-size:12px;color:#633806">weeks this period</span>
      </div>

      <!-- Week 1 -->
      <div class="week-label">Week 1</div>
      <table class="day-table">
        <thead>
          <tr>
            <th>Day</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th class="hide-sm">Note</th>
            <th class="center">Hours</th>
            <th class="center hide-sm">Accumulated</th>
          </tr>
        </thead>
        <tbody id="week1-body"></tbody>
      </table>

      <!-- Week 2 -->
      <div class="week-label">Week 2</div>
      <table class="day-table">
        <thead>
          <tr>
            <th>Day</th>
            <th>Date</th>
            <th>Time In</th>
            <th>Time Out</th>
            <th class="hide-sm">Note</th>
            <th class="center">Hours</th>
            <th class="center hide-sm">Accumulated</th>
          </tr>
        </thead>
        <tbody id="week2-body"></tbody>
      </table>

      <div class="sheet-footer">
        <div class="summary-bar" id="summary-bar" style="flex:1"></div>
        <div style="display:flex;gap:.5rem;margin-left:1rem">
          <button class="btn btn-o" onclick="A.exportPDF()">Export PDF</button>
          <button class="btn btn-g" id="sync-btn" onclick="A.syncAll()">Save to Sheet</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Clock picker -->
<div class="clock-overlay" id="clock-overlay" onclick="CP.closeIfBg(event)">
  <div class="clock-box">
    <h3 id="clock-title">Select Time</h3>
    <div class="clock-live" id="clock-live">--:--</div>
    <input type="time" id="clock-input">
    <button class="clock-confirm" onclick="CP.confirm()">Confirm Time</button>
    <button class="clock-cancel" onclick="CP.close()">Cancel</button>
  </div>
</div>

<!-- Employee management modal -->
<div class="opt-overlay" id="tech-overlay" onclick="A.closeTechsIfBg(event)">
  <div class="opt-modal">
    <h2>Manage Employees</h2>
    <div class="opt-section">
      <h3>Active Employees</h3>
      <div class="opt-list" id="tech-list"></div>
      <div class="opt-add-row" style="margin-top:.5rem">
        <input type="text" id="tech-input" placeholder="Full name…" onkeydown="if(event.key==='Enter')A.addTech()">
        <button onclick="A.addTech()">+ Add</button>
      </div>
    </div>
    <div class="opt-footer">
      <button class="btn btn-g" onclick="A.closeTechs()">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ╔═══════════════════════════════════════════════════════════╗
// ║  PASTE YOUR GOOGLE APPS SCRIPT URL HERE                   ║
// ╚═══════════════════════════════════════════════════════════╝
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIUMNTJhznGnMRoVaDE9D8SEVLIPYDOOlw7vw7rNf5mgnJnxOx8IOPLFRl-aAiP4xl/exec";

const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const A = {
  techName:"", periodStart:"", workdays:[], technicians:[],
  data:{}, // data[date] = {timeIn, timeOut, note}
  onCallWeeks:0,

  /* ── Helpers ── */
  getWorkdays(s){
    const r=[];const d=new Date(s+"T12:00:00");
    for(let i=0;i<14;i++){const c=new Date(d);c.setDate(d.getDate()+i);r.push(c.toISOString().split("T")[0]);}
    return r;
  },
  calcH(a,b){
    if(!a||!b)return 0;
    const[h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number);
    return Math.max(0,((h2*60+m2)-(h1*60+m1))/60);
  },
  fmtH(h){return h.toFixed(2)+"h";},
  toAmPm(t){
    if(!t)return"";
    const[h,m]=t.split(":").map(Number);
    const ap=h>=12?"PM":"AM";const hr=h%12||12;
    return hr+":"+(m<10?"0"+m:m)+" "+ap;
  },
  fmtDate(ds){return new Date(ds+"T12:00:00").toLocaleDateString("en-CA",{month:"short",day:"numeric"});},
  key(){return"ots|"+this.periodStart+"|"+this.techName;},
  dayData(d){return this.data[d]||{timeIn:"",timeOut:"",note:""};},
  dayH(d){const e=this.dayData(d);return this.calcH(e.timeIn,e.timeOut);},
  totalH(){return this.workdays.reduce((s,d)=>s+this.dayH(d),0);},
  isToday(d){return d===new Date().toISOString().split("T")[0];},
  isFuture(d){return d>new Date().toISOString().split("T")[0];},
  isWeekend(d){const day=new Date(d+"T12:00:00").getDay();return day===0||day===6;},

  save(){
    try{localStorage.setItem(this.key(),JSON.stringify({data:this.data,onCallWeeks:this.onCallWeeks}));}catch(e){}
    this.scheduleDriveSave();
  },

  scheduleDriveSave(){
    clearTimeout(this._dt);
    this._dt=setTimeout(()=>this.saveToDrive(),2000);
    this.setCloudStatus("pending");
  },

  setCloudStatus(state){
    ["cloud-status","cloud-status2"].forEach(id=>{
      const el=document.getElementById(id);
      if(!el)return;
      if(state==="pending")el.innerHTML='<span class="csync csync-saving">☁ Saving…</span>';
      else if(state==="saved")el.innerHTML='<span class="csync csync-ok">☁ Saved</span>';
      else if(state==="error")el.innerHTML='<span class="csync csync-err">☁ Save failed</span>';
      else el.innerHTML="";
    });
  },

  async saveToDrive(){
    if(!SCRIPT_URL||SCRIPT_URL==="YOUR_APPS_SCRIPT_URL_HERE")return;
    try{
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"save_draft",techName:this.techName,periodStart:this.periodStart,
          data:this.data,synced:{},note:""})});
      this.setCloudStatus("saved");
    }catch(e){this.setCloudStatus("error");}
  },

  async loadFromDrive(){
    if(!SCRIPT_URL||SCRIPT_URL==="YOUR_APPS_SCRIPT_URL_HERE")return false;
    try{
      const url=SCRIPT_URL.replace("/exec","")+"/exec?action=load_draft"
        +"&tech="+encodeURIComponent(this.techName)
        +"&period="+encodeURIComponent(this.periodStart);
      const resp=await fetch(url,{redirect:"follow"});
      if(!resp.ok)return false;
      const json=await resp.json();
      if(json&&json.found){
        this.data=json.data||{};
        if(json.onCallWeeks!=null)this.onCallWeeks=json.onCallWeeks;
        try{localStorage.setItem(this.key(),JSON.stringify({data:this.data,onCallWeeks:this.onCallWeeks}));}catch(e){}
        return true;
      }
    }catch(e){}
    return false;
  },

  /* ── Load ── */
  async load(){
    const name=document.getElementById("tech-name").value.trim();
    const start=document.getElementById("period-start").value;
    if(!name){A.toast("Please select an employee.","error");return;}
    if(!this.technicians.includes(name)){A.toast("That employee is not in the list.","error");return;}
    if(!start){A.toast("Please select a pay period start date.","error");return;}
    this.techName=name; this.periodStart=start; this.workdays=this.getWorkdays(start);
    try{const s=localStorage.getItem(this.key());if(s){const p=JSON.parse(s);this.data=p.data||{};this.onCallWeeks=p.onCallWeeks||0;}else{this.data={};this.onCallWeeks=0;}}catch(e){this.data={};this.onCallWeeks=0;}
    document.getElementById("sheet-area").style.display="block";
    document.getElementById("setup-card").style.display="none";
    document.getElementById("period-title").textContent=this.workdays[0]+" → "+this.workdays[13]+" · "+name;
    document.getElementById("tech-banner-name").textContent=name;
    document.getElementById("tech-banner-period").textContent=this.workdays[0]+" → "+this.workdays[13];
    this.renderSheet();
    this.setCloudStatus("pending");
    document.getElementById("cloud-status2").innerHTML='<span class="csync csync-saving">☁ Loading…</span>';
    const ok=await this.loadFromDrive();
    if(ok){this.renderSheet();this.toast("Loaded from cloud.","success");}
    this.setCloudStatus("saved");
  },

  /* ── Render ── */
  renderSheet(){
    const oc=document.getElementById("on-call");
    if(oc)oc.value=this.onCallWeeks||"";
    this.renderWeek("week1-body",0,7);
    this.renderWeek("week2-body",7,14);
    this.renderSummary();
  },

  renderWeek(tbodyId, from, to){
    const tbody=document.getElementById(tbodyId);
    if(!tbody)return;
    let acc=0;
    // For accumulated, sum from start of period
    for(let i=0;i<from;i++)acc+=this.dayH(this.workdays[i]);
    const rows=[];
    for(let i=from;i<to;i++){
      const date=this.workdays[i];
      const e=this.dayData(date);
      const h=this.dayH(date);
      acc+=h;
      const dayName=DAY_NAMES[new Date(date+"T12:00:00").getDay()===0?6:new Date(date+"T12:00:00").getDay()-1];
      const isWknd=this.isWeekend(date);
      const isTdy=this.isToday(date);
      const isFtr=this.isFuture(date);
      const rowCls=isFtr?"future":isTdy?"today":isWknd?"weekend":"";
      const tInLabel=e.timeIn?this.toAmPm(e.timeIn):"Tap to set";
      const tOutLabel=e.timeOut?this.toAmPm(e.timeOut):"Tap to set";
      rows.push(`<tr class="${rowCls}">
        <td class="day-name">${dayName}</td>
        <td class="day-date">${this.fmtDate(date)}</td>
        <td class="time-col"><button class="time-btn" onclick="CP.open('${date}','timeIn','${e.timeIn||''}')"><span class="tb-icon">🕐</span>${tInLabel}</button></td>
        <td class="time-col"><button class="time-btn" onclick="CP.open('${date}','timeOut','${e.timeOut||''}')"><span class="tb-icon">🕐</span>${tOutLabel}</button></td>
        <td class="note-col hide-sm"><input class="note-input" type="text" placeholder="Note…" value="${(e.note||"").replace(/"/g,"&quot;")}" oninput="A.updateField('${date}','note',this.value)"></td>
        <td class="hrs-col"><span class="hrs-cell" id="hrs-${date}">${h>0?this.fmtH(h):"—"}</span></td>
        <td class="acc-col hide-sm" id="acc-${date}">${acc>0?this.fmtH(acc):"—"}</td>
      </tr>`);
    }
    tbody.innerHTML=rows.join("");
  },

  renderSummary(){
    const w1=this.workdays.slice(0,7).reduce((s,d)=>s+this.dayH(d),0);
    const w2=this.workdays.slice(7,14).reduce((s,d)=>s+this.dayH(d),0);
    document.getElementById("summary-bar").innerHTML=`
      <div class="si"><div class="sl">Week 1</div><div class="sv">${this.fmtH(w1)}</div></div>
      <div class="si"><div class="sl">Week 2</div><div class="sv">${this.fmtH(w2)}</div></div>
      <div class="si"><div class="sl">Total Hours</div><div class="sv">${this.fmtH(w1+w2)}</div></div>`;
  },

  updateField(date,field,val){
    if(!this.data[date])this.data[date]={timeIn:"",timeOut:"",note:""};
    this.data[date][field]=val;
    if(field==="timeIn"||field==="timeOut"){
      const h=this.dayH(date);
      const el=document.getElementById("hrs-"+date);
      if(el)el.textContent=h>0?this.fmtH(h):"—";
      // Update accumulated hours for this and following rows
      this.updateAccumulated();
      this.renderSummary();
    }
    this.save();
  },

  updateAccumulated(){
    let acc=0;
    this.workdays.forEach(d=>{
      acc+=this.dayH(d);
      const el=document.getElementById("acc-"+d);
      if(el)el.textContent=acc>0?this.fmtH(acc):"—";
    });
  },

  saveOnCall(val){
    this.onCallWeeks=parseFloat(val)||0;
    this.save();
  },

  /* ── Sync to Google Sheet ── */
  async syncAll(){
    if(!SCRIPT_URL||SCRIPT_URL==="YOUR_APPS_SCRIPT_URL_HERE"){A.toast("⚠ No script URL set.","error");return;}
    const btn=document.getElementById("sync-btn");
    btn.disabled=true;btn.innerHTML='<span class="spin"></span> Saving…';
    const rows=[];
    const rowColors=[];
    let acc=0;
    this.workdays.forEach(date=>{
      const e=this.dayData(date);
      const dn=new Date(date+"T12:00:00").toLocaleDateString("en-CA",{weekday:"long"});
      const h=this.dayH(date);
      acc+=h;
      rows.push([date,dn,this.techName,"Office Day",this.toAmPm(e.timeIn),this.toAmPm(e.timeOut),
        parseFloat(h.toFixed(2)),this.fmtH(acc),e.note||"","",""]);
      rowColors.push("#FFFFFF");
    });
    // Total row
    rows.push(["","","","Total Hours","","",parseFloat(this.totalH().toFixed(2)),"",
      "On Call Weeks: "+this.onCallWeeks,"",""]);
    rowColors.push("#E8F5E9");
    try{
      await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"submit_office",techName:this.techName,
          periodStart:this.periodStart,rows,rowColors,
          dayTotal:this.totalH().toFixed(2),noteRows:[]})});
      btn.disabled=false;btn.textContent="Save to Sheet";
      A.toast("Saved to Google Sheet!","success");
    }catch(err){
      A.toast("Network error — data saved locally.","error");
      btn.disabled=false;btn.textContent="Save to Sheet";
    }
  },

  exportPDF(){
    A.toast("PDF export coming soon.","info");
  },

  /* ── Employee management ── */
  loadTechs(){
    try{const t=localStorage.getItem("ots_technicians");if(t)this.technicians=JSON.parse(t)||[];}catch(e){}
    this.populateTechDropdown();
  },
  saveTechs(){try{localStorage.setItem("ots_technicians",JSON.stringify(this.technicians));}catch(e){}},
  populateTechDropdown(){
    const sel=document.getElementById("tech-name");if(!sel)return;
    const cur=sel.value;
    sel.innerHTML='<option value="">— Select employee —</option>';
    this.technicians.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;if(n===cur)o.selected=true;sel.appendChild(o);});
  },
  openTechs(){document.getElementById("tech-overlay").classList.add("open");this.renderTechList();},
  closeTechs(){document.getElementById("tech-overlay").classList.remove("open");this.populateTechDropdown();},
  closeTechsIfBg(e){if(e.target===document.getElementById("tech-overlay"))this.closeTechs();},
  renderTechList(){
    const el=document.getElementById("tech-list");
    if(!this.technicians.length){el.innerHTML='<div class="no-techs">No employees added yet.</div>';return;}
    el.innerHTML=this.technicians.map((n,i)=>
      `<div class="opt-item"><span style="flex:1">${n}</span>
       <button class="dl-tech-btn" onclick="A.generateOfficeFile('${n.replace(/'/g,"\\'")}')">⬇ Download</button>
       <button class="rm-btn" onclick="A.removeTech(${i})" style="margin-left:6px">×</button></div>`
    ).join("");
  },
  addTech(){
    const val=document.getElementById("tech-input").value.trim();
    if(!val){A.toast("Please enter a name.","error");return;}
    if(this.technicians.some(n=>n.toLowerCase()===val.toLowerCase())){A.toast("Name already exists.","error");return;}
    this.technicians.push(val);this.saveTechs();
    document.getElementById("tech-input").value="";
    this.renderTechList();A.toast('"'+val+'" added!','success');
  },
  removeTech(idx){
    if(!confirm('Remove "'+this.technicians[idx]+'"?'))return;
    this.technicians.splice(idx,1);this.saveTechs();this.renderTechList();
  },
  generateOfficeFile(name){
    let src=document.documentElement.outerHTML;
    const dropdownBlock=document.getElementById("setup-card").outerHTML;
    const lockedBlock=`<div class="card" id="setup-card">
      <div class="card-title">Pay Period Setup</div>
      <div class="setup-grid">
        <div class="field"><label>Employee</label>
          <div style="padding:.5rem .7rem;border:1px solid var(--g100);border-radius:var(--r);font-size:14px;background:var(--g50);color:var(--g700);font-weight:600">${name}</div>
        </div>
        <div class="field"><label>Pay Period Start</label><input type="date" id="period-start"></div>
        <div><button class="btn btn-g" onclick="A.load()" style="width:100%;padding:.55rem">Load Timesheet</button></div>
      </div>
    </div>`;
    src=src.replace(dropdownBlock,lockedBlock);
    src=src.replace('document.getElementById("tech-overlay").outerHTML','""');
    src=src.replace('const name=document.getElementById("tech-name").value.trim();',`const name="${name}";`);
    src=src.replace('if(!this.technicians.includes(name)){A.toast("That employee is not in the list.","error");return;}','');
    src=src.replace('A.loadTechs();','');
    const blob=new Blob([src],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="Office_Timesheet_"+name.replace(/\s+/g,"_")+".html";
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    A.toast("Downloaded for "+name,"success");
  },

  toast(msg,type="info",ms=3500){
    const el=document.getElementById("toast");el.textContent=msg;el.className="show "+type;
    clearTimeout(this._tt);this._tt=setTimeout(()=>{el.className=type;},ms);
  }
};

/* ── Clock Picker ── */
const CP = {
  date:null, field:null, _tick:null,
  open(date,field,cur){
    this.date=date;this.field=field;
    const inp=document.getElementById("clock-input");
    const title=document.getElementById("clock-title");
    if(title)title.textContent=field==="timeIn"?"Select Time In":"Select Time Out";
    if(inp)inp.value=cur||"08:00";
    this._show();
  },
  _show(){
    document.getElementById("clock-overlay").classList.add("open");
    this._tick=setInterval(()=>{
      const el=document.getElementById("clock-live");
      if(el)el.textContent=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
    },1000);
    const el=document.getElementById("clock-live");
    if(el)el.textContent=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true});
    setTimeout(()=>{const i=document.getElementById("clock-input");if(i)i.focus();},100);
  },
  close(){document.getElementById("clock-overlay").classList.remove("open");clearInterval(this._tick);},
  closeIfBg(e){if(e.target===document.getElementById("clock-overlay"))this.close();},
  confirm(){
    const val=document.getElementById("clock-input").value;
    if(!val){this.close();return;}
    A.updateField(this.date,this.field,val);
    // Re-render the row to update button label
    A.renderSheet();
    this.close();
  }
};

window.addEventListener("DOMContentLoaded",()=>{
  A.loadTechs();

  const ANCHOR=new Date("2026-04-06T12:00:00");
  function isPayStart(date){
    const diff=Math.round((date-ANCHOR)/(1000*60*60*24));
    return diff>=0&&diff%14===0;
  }
  function getCurrentPayStart(){
    const today=new Date();today.setHours(12,0,0,0);
    const diffDays=Math.floor((today-ANCHOR)/(1000*60*60*24));
    const num=Math.floor(diffDays/14);
    const cur=new Date(ANCHOR);cur.setDate(ANCHOR.getDate()+num*14);
    return cur;
  }
  const currentStart=getCurrentPayStart();
  const currentStr=currentStart.toISOString().split("T")[0];
  const pi=document.getElementById("period-start");
  if(pi)pi.value=currentStr;

  flatpickr("#period-start",{
    dateFormat:"Y-m-d",defaultDate:currentStr,allowInput:false,disableMobile:true,
    enable:[d=>isPayStart(d)],
    onDayCreate(dObj,dStr,fp,dayElem){
      const d=dayElem.dateObj;if(!d||!isPayStart(d))return;
      const ds=d.toISOString().split("T")[0];
      dayElem.classList.add(ds===currentStr?"pay-current":"pay-start");
    }
  });
});
</script>
